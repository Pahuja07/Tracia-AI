entity_types:
  Person:
    required_properties: [name, entity_type]
    optional_properties: [alias, age, gender, contact_number]

  Location:
    required_properties: [name, entity_type]
    optional_properties: [address, city, pincode]

  Vehicle:
    required_properties: [name, entity_type]
    optional_properties: [registration_number, vehicle_type, color]

  Weapon:
    required_properties: [name, entity_type]
    optional_properties: [weapon_type, serial_number]

  Organization:
    required_properties: [name, entity_type]
    optional_properties: [org_type, registration_number]

  CASE:
    required_properties: [name, entity_type]
    optional_properties: [case_id]

  CASE_REFERENCE:
    required_properties: [name, entity_type]
    optional_properties: []

  DATE:
    required_properties: [name, entity_type]
    optional_properties: []

  EMAIL:
    required_properties: [name, entity_type]
    optional_properties: []

  PHONE:
    required_properties: [name, entity_type]
    optional_properties: []

  Address:
    required_properties: [name, entity_type]
    optional_properties: [city, latitude, longitude]

  BankAccount:
    required_properties: [name, entity_type]
    optional_properties: [account_number, bank_name]

  Transaction:
    required_properties: [name, entity_type]
    optional_properties: [amount, currency, transaction_date]

  Communication:
    required_properties: [name, entity_type]
    optional_properties: [communication_type, timestamp]

  Evidence:
    required_properties: [name, entity_type]
    optional_properties: [case_id, source_file, page_number, text_span, confidence, sha256]

  CRIME:
    required_properties: [name, entity_type]
    optional_properties: []

relationship_types:
  KNOWS:
    valid_pairs:
      - [Person, Person]

  OWNS:
    valid_pairs:
      - [Person, Vehicle]
      - [Person, Weapon]
      - [Organization, Vehicle]

  INVOLVED_IN:
    valid_pairs:
      - [Person, Person]
      - [Person, Organization]

  LOCATED_AT:
    valid_pairs:
      - [Person, Location]
      - [Vehicle, Location]
      - [Organization, Location]

  ASSOCIATED_WITH:
    valid_pairs:
      - [Person, Organization]
      - [Person, Person]
      - [Person, EMAIL]
      - [Person, PHONE]

  CALLS:
    valid_pairs:
      - [Person, PHONE]
      - [Phone, Phone]

  MESSAGES:
    valid_pairs:
      - [Person, PHONE]
      - [Phone, Phone]

  MEMBER_OF:
    valid_pairs:
      - [Person, Organization]

  USES_ACCOUNT:
    valid_pairs:
      - [Person, BankAccount]
      - [Organization, BankAccount]

  TRANSFERRED_TO:
    valid_pairs:
      - [BankAccount, BankAccount]

  TRANSACTED_WITH:
    valid_pairs:
      - [Person, Transaction]
      - [BankAccount, Transaction]

  SUPPORTED_BY:
    valid_pairs: []

  HAS_CRIME:
    valid_pairs:
      - [CASE, CRIME]

  OCCURRED_IN:
    valid_pairs:
      - [CASE, Location]

  HAS_VICTIM:
    valid_pairs:
      - [CASE, Person]

  INVOLVES_WEAPON:
    valid_pairs:
      - [CASE, Weapon]

  INVOLVES_ORG:
    valid_pairs:
      - [CASE, Organization]

  REPORTED_ON:
    valid_pairs:
      - [CASE, DATE]

  RELATED_TO:
    valid_pairs: []   # fallback type — koi bhi pair allowed
